[common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port   = /dev/cu.usbserial-0001
upload_speed  = 115200
monitor_port  = /dev/cu.usbserial-0001

; the phone: microphone + wifi + relay
[env:esp32dev]
extends          = common
lib_deps         = links2004/WebSockets@^2.4.1
build_src_filter = +<*> -<speaker_test.cpp>

; bench check: speaker only, nothing else running
[env:speakertest]
extends          = common
build_src_filter = +<speaker_test.cpp>
