[common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port   = /dev/cu.usbserial-0001
upload_speed  = 115200
monitor_port  = /dev/cu.usbserial-0001

; the phone: microphone + wifi + relay
[env:esp32dev]
extends          = common
lib_deps         = links2004/WebSockets@^2.4.1
build_src_filter = +<*> -<speaker_test.cpp>

; bench check: speaker only, nothing else running
[env:speakertest]
extends          = common
build_src_filter = +<speaker_test.cpp>

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32-S3.  Different chip, so note what changes:
;   * the S3 has NO built-in DAC  -> the NS4168 over I2S is the only way out
;   * no I2S-ADC mode either      -> the mic is PDM (Sense) or an external I2S part
;   * native USB, so the port appears as /dev/cu.usbmodem*, not usbserial
; PSRAM is opt-in and worth having: 8 MB changes what fits.
; ---------------------------------------------------------------------------
[env:xiao]
platform         = espressif32
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
lib_deps         = links2004/WebSockets@^2.4.1
build_src_filter = +<xiao_main.cpp>
build_flags      =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; speaker only on the XIAO -- isolates the amp from network and microphone
[env:xiaospk]
platform         = espressif32
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_src_filter = +<xiao_spk_test.cpp>
build_flags      = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

; camera only -- captures a JPEG and prints it as base64 over USB
[env:xiaocam]
platform         = espressif32
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_src_filter = +<xiao_cam_test.cpp>
build_flags      = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
